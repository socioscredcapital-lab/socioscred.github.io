<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios Cred - Análise de Crédito</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0066CC 0%, #10B981 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #0066CC;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #10B981;
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 600;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: linear-gradient(135deg, #0066CC, #10B981);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 102, 204, 0.3);
        }
        
        .emoji {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Socios Cred</h1>
        <p class="subtitle">Sistema de Análise de Crédito</p>
        
        <div class="links">
            <a href="formulario.html">
                <span class="emoji">📝</span>
                <span>Formulário do Cliente</span>
            </a>
            
            <a href="admin.html">
                <span class="emoji">👨‍💼</span>
                <span>Dashboard Admin</span>
            </a>
            
            <a href="checklist_interativo.html">
                <span class="emoji">✅</span>
                <span>Checklist de Análise</span>
            </a>
        </div>
    </div>
</body>
</html>
